# OpenHIS — Docker Compose (Linux).
#
#   ./setup.sh            -> 6 core services only (sqlserver, redis, static,
#                              baseapi, settapi, sso)
#   ./setup.sh --all      -> all 23 apps (adds profile "all")
#   docker compose --profile all up -d   -> same, manually
#
# Host ports are the SAME numbers as on the VM, so every URL in the docs
# stays valid (open http://127.0.0.1:5208 in the browser, never
# http://localhost:5208 — see DOCKER-SETUP.md).
#
# How the apps find each other (see DOCKER-SETUP.md § "Host mapping" for
# the grep evidence):
#   * Server-side host keys (BaseAPI/AuthCenter/Manage/Sett.API/PDS.API/
#     CIS.API) point at Docker service names: http://baseapi:7001/ etc.
#     The app server calls these itself, so the service name resolves
#     inside the Docker network.
#   * SiteStaticHost stays http://127.0.0.1:41142/ — it is rendered into
#     <script>/<link> tags, so the BROWSER loads it; the browser is on
#     the host, not in the network.
#   * Document_Domain stays 127.0.0.1 for the same reason.
#   * BusinessDB__DefaultConn keeps the "{0}" slot: the code does
#     string.Format(DefaultConn, dbName) per app (ServiceExtensions.cs:540),
#     so each app still gets its own catalog from its appsettings DBConf.
#   * Secrets come from .env (generated by setup.sh, never committed):
#     one APP_SECRET is shared by BaseAPI / WebAPI.Manage /
#     AuthCenter (JWT SSOAuthApp 0-7) in this local setup. On the VM each
#     app has its own secret; for local testing one shared secret keeps
#     setup.sh to a single value. Use distinct secrets in production.

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_SYSTEM_NET_DISABLEIPV6: "true"
  BusinessDB__DefaultConn: "Data Source=sqlserver;Initial Catalog={0};User ID=sa;Password=${SA_PASSWORD}"
  RedisConfig__Connection: "redis:6379,password=${REDIS_PASSWORD}"
  BusinessConfig__AppAPIHost__HisAppBaseAPIHost: "http://baseapi:7001/"
  BusinessConfig__AppAPIHost__SiteBaseAPIHost: "http://baseapi:7001/"
  BusinessConfig__AppAPIHost__SiteAuthCenterHost: "http://authcenter:8015/"
  BusinessConfig__AppAPIHost__SiteApiManageHost: "http://apimanage:8016/"
  BusinessConfig__AppAPIHost__SiteSettAPIHost: "http://settapi:7002/"
  BusinessConfig__AppAPIHost__SitePdsAPIHost: "http://pdsapi:5337/"
  BusinessConfig__AppAPIHost__SiteCisAPIHost: "http://cisapi:5334/"
  BusinessConfig__AppAPIHost__SiteStaticHost: "http://127.0.0.1:41142/"
  # Fallback prefix: some code reads _config["AppAPIHost:..."] directly
  # (e.g. AuthController falls back to AppAPIHost:HisAppBaseAPIHost).
  AppAPIHost__HisAppBaseAPIHost: "http://baseapi:7001/"
  AppAPIHost__SiteBaseAPIHost: "http://baseapi:7001/"
  AppAPIHost__SiteAuthCenterHost: "http://authcenter:8015/"
  AppAPIHost__SiteApiManageHost: "http://apimanage:8016/"
  AppAPIHost__SiteSettAPIHost: "http://settapi:7002/"
  AppAPIHost__SitePdsAPIHost: "http://pdsapi:5337/"
  AppAPIHost__SiteCisAPIHost: "http://cisapi:5334/"
  AccessConfig__Document_Domain: "127.0.0.1"

x-app-depends: &app-depends
  sqlserver:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ---------------------------------------------------------------- infra
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server 2022 has no ARM64 image; on Apple Silicon this runs
    # under emulation (slow but works for local testing).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      # .bak files are mounted read-only; restore_dbs.py reads them from
      # /sqlbackup inside the container.
      - ./sqlbackup:/sqlbackup:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  static:
    build:
      context: docker/static
      dockerfile: Dockerfile
    image: openhis-static:local
    ports:
      - "41142:41142"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:41142/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ------------------------------------------------------- core apps (6)
  baseapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        PROJECT: Newtouch.HIS.SSO/HIS.BaseAPI/HIS.BaseAPI.csproj
        DLL: HIS.BaseAPI.dll
        PORT: "7001"
        CONFIG: Release
    image: openhis-baseapi:local
    environment:
      <<: *app-env
      ASPNETCORE_URLS: "http://+:7001"
      SSOAuthIdentity__0__AppSecret: ${APP_SECRET}
    ports:
      - "7001:7001"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:7001/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  settapi:
